<div class="workspace-shell">
  <header class="workspace-header" [class.workspace-header--scrolled]="isScrolled()">
    <div class="ts-container workspace-header__row">
      <a routerLink="/" class="brand brand--compact">
        <span class="brand__mark">TS</span>
        <span>TinySpring</span>
      </a>

      <nav class="workspace-main-nav">
        <a
          *ngFor="let item of navGroups()"
          [routerLink]="item.route"
          [class.workspace-main-nav__link--active]="isGroupActive(item)"
          class="workspace-main-nav__link">
          {{ item.label }}
        </a>
      </nav>

      <div class="workspace-tools">
     <div class="notification-wrapper" *ngIf="role() === 'PARENT'">

  <button class="notification-trigger" (click)="toggleNotifications()">
    🔔
    <span *ngIf="notificationCount() > 0" class="badge">
      {{ notificationCount() }}
    </span>
  </button>

  <div *ngIf="notificationPanelOpen()" class="notification-dropdown">

    <div class="header">
      <strong>Notifications</strong>
      <span>{{ notificationCount() }} non lues</span>
    </div>

    <div class="list">
      <div *ngFor="let n of notifications()" 
           class="item"
           [class.unread]="!n.seen"
           (click)="markNotificationAsSeen(n)">

        <div class="icon">⚠️</div>

        <div class="content">
          <strong>{{ n.title }}</strong>
          <p>{{ n.message }}</p>
          <small>{{ n.createdAt | date:'shortTime' }}</small>
        </div>

      </div>
    </div>

  </div>
</div>

        <button type="button" class="profile-trigger" (click)="toggleMenu()">
          <span class="profile-trigger__avatar">{{ currentUser()?.initiales }}</span>
          <span class="profile-trigger__meta">
            <strong>{{ currentUser()?.nom }}</strong>
            <small>{{ roleLabel() }}</small>
          </span>
        </button>

        <div class="profile-menu" *ngIf="menuOpen()">
          <button type="button">Mon profil</button>
          <button type="button">Parametres</button>
          <button type="button" (click)="logout()">Se deconnecter</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="workspace-subnav" *ngIf="subnavItems().length">
    <div class="ts-container workspace-subnav__row">
      <a
        *ngFor="let item of subnavItems()"
        [routerLink]="item.route"
        routerLinkActive="workspace-subnav__link--active"
        class="workspace-subnav__link">
        {{ item.label }}
      </a>
    </div>
  </nav>

  <main class="workspace-main">
    <router-outlet></router-outlet>
  </main>

<div *ngIf="toastNotification() as toast" class="toast">

  <div class="left-border"></div>

  <div class="body">
    <strong>{{ toast.title }}</strong>
    <p>{{ toast.message }}</p>

    <div class="actions">
      <button   >Voir le menu</button>
      <button (click)="closeToast()">Ignorer</button>
    </div>
  </div>

  <button class="close" (click)="closeToast()">×</button>
</div>
</div>
