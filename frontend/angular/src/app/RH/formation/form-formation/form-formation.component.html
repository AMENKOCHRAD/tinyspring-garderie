<div class="page-wrapper">

  <div class="page-header">
    <div class="header-left">
      <h2 class="page-title">{{ isEditMode ? 'Modifier' : 'Ajouter' }} une formation</h2>
      <nav class="breadcrumb-nav">
        <span>🏠</span>
        <span class="separator">/</span>
        <span>RH & Formations</span>
        <span class="separator">/</span>
        <span routerLink="/rh/formations" class="link">Formations</span>
        <span class="separator">/</span>
        <span class="active">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</span>
      </nav>
    </div>
  </div>

  <div class="alert alert-success" *ngIf="successMessage">✅ {{ successMessage }}</div>
  <div class="alert alert-error" *ngIf="errorMessage">❌ {{ errorMessage }}</div>

  <div class="form-card">
    <div class="form-card-header">
      <h3>{{ isEditMode ? 'Informations de la formation' : 'Nouvelle formation' }}</h3>
    </div>

    <form (ngSubmit)="onSubmit()" #formationForm="ngForm" class="form-body">

      <div class="form-row">
        <div class="form-group full-width">
          <label>Titre <span class="required">*</span></label>
          <input type="text" [(ngModel)]="formation.titre" name="titre"
            required placeholder="Ex: Premiers secours enfants" class="form-input" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group full-width">
          <label>Description</label>
          <textarea [(ngModel)]="formation.description" name="description"
            placeholder="Description de la formation..." class="form-input textarea" rows="3">
          </textarea>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Type <span class="required">*</span></label>
          <select [(ngModel)]="formation.type" name="type" class="form-input">
            <option value="INTERNE">Interne</option>
            <option value="EXTERNE">Externe</option>
          </select>
        </div>
        <div class="form-group">
          <label>Formateur</label>
          <input type="text" [(ngModel)]="formation.formateur" name="formateur"
            placeholder="Ex: Croix Rouge" class="form-input" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date début</label>
          <input type="date" [(ngModel)]="formation.dateDebut" name="dateDebut" class="form-input" />
        </div>
        <div class="form-group">
          <label>Date fin</label>
          <input type="date" [(ngModel)]="formation.dateFin" name="dateFin" class="form-input" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nombre de places</label>
          <input type="number" [(ngModel)]="formation.placesMax" name="placesMax"
            min="1" class="form-input" />
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select [(ngModel)]="formation.statutInscription" name="statutInscription" class="form-input">
            <option value="INSCRITE">Inscrite</option>
            <option value="EN_COURS">En cours</option>
            <option value="TERMINEE">Terminée</option>
            <option value="ABANDONNEE">Abandonnée</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn-submit"
          [disabled]="isLoading || formationForm.invalid">
          {{ isLoading ? 'Chargement...' : (isEditMode ? 'Modifier' : 'Ajouter') }}
        </button>
      </div>

    </form>
  </div>

</div>
