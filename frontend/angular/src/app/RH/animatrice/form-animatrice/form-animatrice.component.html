<div class="page-wrapper">

  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <h2 class="page-title">{{ isEditMode ? 'Modifier' : 'Ajouter' }} une animatrice</h2>
      <nav class="breadcrumb-nav">
        <span>🏠</span>
        <span class="separator">/</span>
        <span>RH & Formations</span>
        <span class="separator">/</span>
        <span routerLink="/rh/animatrices" class="link">Animatrices</span>
        <span class="separator">/</span>
        <span class="active">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</span>
      </nav>
    </div>
  </div>

  <!-- Alerts -->
  <div class="alert alert-success" *ngIf="successMessage">
    ✅ {{ successMessage }}
  </div>
  <div class="alert alert-error" *ngIf="errorMessage">
    ❌ {{ errorMessage }}
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <div class="form-card-header">
      <h3>{{ isEditMode ? 'Informations de l\'animatrice' : 'Nouvelle animatrice' }}</h3>
    </div>

    <form (ngSubmit)="onSubmit()" #animatriceForm="ngForm" class="form-body">

      <div class="form-row">
        <div class="form-group">
          <label>Nom <span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="animatrice.nom"
            name="nom"
            required
            placeholder="Ex: Ben Ali"
            class="form-input"
          />
        </div>
        <div class="form-group">
          <label>Prénom <span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="animatrice.prenom"
            name="prenom"
            required
            placeholder="Ex: Sara"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input
            type="email"
            [(ngModel)]="animatrice.email"
            name="email"
            required
            placeholder="Ex: sara@tinyspring.com"
            class="form-input"
          />
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input
            type="text"
            [(ngModel)]="animatrice.telephone"
            name="telephone"
            placeholder="Ex: 12345678"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date d'embauche</label>
          <input
            type="date"
            [(ngModel)]="animatrice.dateEmbauche"
            name="dateEmbauche"
            class="form-input"
          />
        </div>
        <div class="form-group">
          <label>Spécialité</label>
          <input
            type="text"
            [(ngModel)]="animatrice.specialite"
            name="specialite"
            placeholder="Ex: Éveil musical"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Statut</label>
          <select [(ngModel)]="animatrice.statut" name="statut" class="form-input">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo URL</label>
          <input
            type="text"
            [(ngModel)]="animatrice.photoUrl"
            name="photoUrl"
            placeholder="https://..."
            class="form-input"
          />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">
          Annuler
        </button>
        <button type="submit" class="btn-submit" [disabled]="isLoading || animatriceForm.invalid">
          {{ isLoading ? 'Chargement...' : (isEditMode ? 'Modifier' : 'Ajouter') }}
        </button>
      </div>

    </form>
  </div>

</div>
