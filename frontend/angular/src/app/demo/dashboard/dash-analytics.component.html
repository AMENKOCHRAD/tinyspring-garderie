<div class="row">
  <div class="col-md-6 col-xl-3 m-b-20" *ngFor="let card of cards">
    <a *ngIf="card.route; else noLink" [routerLink]="card.route" style="text-decoration: none;">
      <app-card
        [hidHeader]="true"
        [cardClass]="card.background + ' order-card hover-scale'"
        style="cursor: pointer; display: block;"
      >
        <h6 class="text-white text-center font-weight-bold p-t-10">
          {{ card.title }}
        </h6>
        <h2 class="text-center text-white m-b-0 m-t-20 p-b-20">
          <i class="feather {{ card.icon }}"></i>
        </h2>
      </app-card>
    </a>

    <ng-template #noLink>
      <app-card
        [hidHeader]="true"
        [cardClass]="card.background + ' order-card hover-scale'"
        style="display: block;"
      >
        <h6 class="text-white text-center font-weight-bold p-t-10">
          {{ card.title }}
        </h6>
        <h2 class="text-center text-white m-b-0 m-t-20 p-b-20">
          <i class="feather {{ card.icon }}"></i>
        </h2>
      </app-card>
    </ng-template>
  </div>
</div>
