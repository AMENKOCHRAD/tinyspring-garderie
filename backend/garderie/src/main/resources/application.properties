app.transport.recommandation.distance-max-km=5.0
app.transport.recommandation.rayon-regroupement-km=2.0
app.transport.recommandation.nombre-minimal-demandes-pour-nouveau-trajet=3
app.transport.recommandation.score-texte-minimal=60

app.transport.ai.base-url=http://localhost:8001
app.transport.ai.timeout-seconds=5
