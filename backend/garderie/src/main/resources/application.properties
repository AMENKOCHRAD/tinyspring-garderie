spring.application.name=garderie
server.port=8081
# MySQL config
spring.datasource.url=jdbc:mysql://localhost:3306/garderie_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# ===== AJOUTER dans application.properties =====

# Dossier upload images boutique
file.upload-dir=uploads/boutique

# Taille max fichier upload (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
