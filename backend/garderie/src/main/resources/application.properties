spring.application.name=garderie
server.port=8081
# MySQL config
spring.datasource.url=jdbc:mysql://localhost:3307/garderie_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
# JWT
application.security.jwt.secret-key=VGlueVNwcmluZ0dhcmRlcmllSldUU2VjcmV0S2V5Rm9yQXV0aGVudGljYXRpb24yMDI2IQ==
application.security.jwt.expiration=86400000

# Uploads (ordonnances PDF)
app.uploads.ordonnances-dir=uploads/ordonnances

# OpenAI (optionnel) - pour suggestions IA des observations
# Recommandé: définir la clé via variable d'environnement ou un fichier local non versionné.
app.openai.api-key=
app.openai.model=gpt-4o-mini
app.openai.reasoning-effort=none
app.openai.timeout-seconds=20
