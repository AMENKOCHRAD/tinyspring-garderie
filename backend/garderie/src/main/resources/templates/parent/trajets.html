<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajets Parent</title>
    <link rel="stylesheet" th:href="@{/css/parent.css}">
</head>
<body>
<div class="container">
    <header class="page-header">
        <div>
            <h1>Trajets disponibles</h1>
            <p th:text="'Parent simule : ' + ${parent.nom}"></p>
        </div>
        <nav class="nav-links">
            <a th:href="@{/parent/trajets}">Trajets</a>
            <a th:href="@{/parent/demandes}">Mes demandes</a>
        </nav>
    </header>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Point de depart</th>
                <th>Destination</th>
                <th>Date</th>
                <th>Heure de depart</th>
                <th>Transport</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(trajets)}">
                <td colspan="6">Aucun trajet disponible.</td>
            </tr>
            <tr th:each="trajet : ${trajets}">
                <td th:text="${trajet.pointDepart}"></td>
                <td th:text="${trajet.destination}"></td>
                <td th:text="${trajet.dateTrajet}"></td>
                <td th:text="${trajet.heureDepart}"></td>
                <td th:text="${trajet.transport.nom + ' (' + trajet.transport.matricule + ')'}"></td>
                <td>
                    <a class="button" th:href="@{/parent/demande(trajetId=${trajet.id})}">Demander transport</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
